# UA Auth Lab 全拆矩阵端口（自动生成，勿手改）
# 端口: 48744  端点: Basic256 / SignAndEncrypt  (deprecated)
# 认证: x509（该端口只开放这一种）
# 源: matrix.yaml  重新生成: python tools/gen_matrix_configs.py
# 启动: python main.py configs/matrix/p48744_Basic256_SignAndEncrypt_x509.yaml

scenario: matrix_Basic256_SignAndEncrypt_x509
server: 0.0.0.0
port: 48744
endpoint_path: /ua_auth/
cycle: 1000
namespace_index: 1
application:
  name: UA Auth Lab (matrix port)
  uri: urn:ua-auth-lab:server
security:
  trust_store: ../../test_material/certs/trust
  application_certificate:
    cert: ../../test_material/certs/server_cert.pem
    private_key: ../../test_material/certs/server_key.pem
  policies:
  - Basic256_SignAndEncrypt
  discovery: true
  require_secured_session: true
user_auth:
  anonymous: false
  username: false
  x509: true
  x509_user_cert:
  - ../../test_material/certs/user_cert.pem
  - ../../test_material/certs/user_expired_cert.pem
  x509_user_name: x509_user
  x509_validation: direct
nodes:
- name: int32_ch_
  type: Int32
  count: 2
  change: true
  writable: false
- name: int32_wr_
  type: Int32
  count: 2
  default: 0
  change: false
  writable: true
- name: double_ch_
  type: Double
  count: 2
  change: true
  writable: false
- name: double_wr_
  type: Double
  count: 2
  default: 0.0
  change: false
  writable: true
- name: string_ch_
  type: String
  count: 2
  change: true
  writable: false
- name: bool_wr_
  type: Boolean
  count: 2
  default: false
  change: false
  writable: true
