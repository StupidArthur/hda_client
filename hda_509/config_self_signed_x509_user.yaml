# OPC UA X.509 Compatibility Mocker - Self-signed Application + X.509 User scenario
#
#   opc.tcp://0.0.0.0:48627/ua_mocker/
#
# COMBINED authentication, fully self-signed (no Test Root CA):
#
#   Server Application Certificate      self-signed (server/)
#   Client Application Certificate      self-signed (client/) -> trusted in (trust/)
#     -> validated at CreateSession (application trust store)
#
#   User Certificate                    self-signed, SEPARATE key pair (user/)
#     -> registered X.509 user in the user-manager direct whitelist
#     -> validated at ActivateSession (X509IdentityToken)
#
#   Client Application Certificate != User Certificate  (two different cert/key pairs)
#
# SecurityPolicy: Basic256Sha256 / MessageSecurityMode: SignAndEncrypt.
# Anonymous and Username are DISABLED: only X509 User authentication.
#
# Generate the PKI:
#   python test_material/self_signed/gen_self_signed_certs.py
#
# Start:
#   python main.py config_self_signed_x509_user.yaml
#
# Tests:
#   python tests/self_signed_x509_user_tests.py
#
# Manual:
#   python client/reference_client.py --url opc.tcp://127.0.0.1:48627/ua_mocker/ \
#       --app-cert test_material/self_signed/client/client_self_signed_cert.pem \
#       --app-key test_material/self_signed/client/client_self_signed_key.pem \
#       --server-cert test_material/self_signed/server/server_self_signed_cert.pem \
#       --app-uri urn:example.org:FreeOpcUa:selfsigned-client \
#       --auth x509 \
#       --user-cert test_material/self_signed/user/user_self_signed_cert.pem \
#       --user-key test_material/self_signed/user/user_self_signed_key.pem

scenario: self_signed_x509_user

server: "0.0.0.0"
port: 48627
endpoint_path: "/ua_mocker/"
cycle: 1000
namespace_index: 1

application:
  name: "ua_hda X.509 Mocker (self-signed + X.509 user)"
  uri: "urn:freeopcua:python:server"

security:
  policies:
    - Basic256Sha256_Sign
    - Basic256Sha256_SignAndEncrypt
  discovery: true
  require_secured_session: true
  application_certificate:
    cert: "test_material/self_signed/server/server_self_signed_cert.pem"
    private_key: "test_material/self_signed/server/server_self_signed_key.pem"
  # Application Trust：只放受信任的 self-signed 客户端 Application 证书。
  # 绝不把 User Certificate 放进来（两个信任域严格隔离）。
  trust_store: "test_material/self_signed/trust"

user_auth:
  # 仅允许 X.509 User 认证：不允许 Anonymous fallback / Username。
  anonymous: false
  username: false
  x509: true
  x509_validation: direct
  # User Authentication：direct whitelist —— 注册独立的 self-signed User Certificate。
  # user_self_signed_cert.pem        正常注册用户，认证通过
  # user_self_signed_expired_cert.pem 已在白名单但已过期 -> 有效期检查拒绝
  x509_user_cert:
    - "test_material/self_signed/user/user_self_signed_cert.pem"
    - "test_material/self_signed/user/user_self_signed_expired_cert.pem"
  x509_user_name: "x509_user"

nodes:
  - name: "int32_ch_"
    type: Int32
    count: 2
    change: true
    writable: false
  - name: "double_wr_"
    type: Double
    count: 2
    default: 0.0
    change: false
    writable: true
  - name: "string_ch_"
    type: String
    count: 2
    change: true
    writable: false
