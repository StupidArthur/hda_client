# OPC UA X.509 Compatibility Mocker - Normal / compatibility scenario
#
# Single endpoint URL, multiple SecurityPolicies published:
#   opc.tcp://0.0.0.0:48620/ua_mocker/
#
# asyncua 2.0.1 supports (SECURITY_POLICY_TYPE_MAP):
#   Basic256Sha256        Sign / SignAndEncrypt
#   Aes128Sha256RsaOaep   Sign / SignAndEncrypt
#   Aes256Sha256RsaPss    Sign / SignAndEncrypt
# NoSecurity (None/None) is NOT published by default (set no_security: true
# only for negative-testing purposes).
#
# Run:
#   python main.py config_x509.yaml

scenario: normal

server: "0.0.0.0"
port: 48620
endpoint_path: "/ua_mocker/"
cycle: 1000
namespace_index: 1

application:
  name: "ua_hda X.509 Compatibility Mocker"
  uri: "urn:freeopcua:python:server"

security:
  policies:
    - Basic256Sha256_Sign
    - Basic256Sha256_SignAndEncrypt
    - Aes128Sha256RsaOaep_Sign
    - Aes128Sha256RsaOaep_SignAndEncrypt
    - Aes256Sha256RsaPss_Sign
    - Aes256Sha256RsaPss_SignAndEncrypt
  # no_security: true   # 打开后会把 NoSecurity 端点也发布出来（仅用于负向验证）
  application_certificate:
    cert: "test_material/certs/server_cert.pem"
    private_key: "test_material/certs/server_key.pem"
  trust_store: "test_material/certs/trust"

# User authentication. Two separate concepts (see README):
#   Application Certificate  -> CreateSession (server validates via trust_store)
#   User X.509 Certificate   -> ActivateSession / X509IdentityToken
user_auth:
  anonymous: true
  username: true
  users:
    - username: "test"
      password: "test"
  x509: true
  x509_user_cert: "test_material/certs/user_cert.pem"
  x509_user_name: "x509_user"

nodes:
  # Boolean: 2 个自变化只读 + 2 个固定可写
  - name: "bool_ch_"
    type: Boolean
    count: 2
    change: true
    writable: false
  - name: "bool_wr_"
    type: Boolean
    count: 2
    default: false
    change: false
    writable: true

  # SByte
  - name: "sbyte_ch_"
    type: SByte
    count: 2
    change: true
    writable: false
  - name: "sbyte_wr_"
    type: SByte
    count: 2
    default: 0
    change: false
    writable: true

  # Byte
  - name: "byte_ch_"
    type: Byte
    count: 2
    change: true
    writable: false
  - name: "byte_wr_"
    type: Byte
    count: 2
    default: 0
    change: false
    writable: true

  # Int16
  - name: "int16_ch_"
    type: Int16
    count: 2
    change: true
    writable: false
  - name: "int16_wr_"
    type: Int16
    count: 2
    default: 0
    change: false
    writable: true

  # UInt16
  - name: "uint16_ch_"
    type: UInt16
    count: 2
    change: true
    writable: false
  - name: "uint16_wr_"
    type: UInt16
    count: 2
    default: 0
    change: false
    writable: true

  # Int32
  - name: "int32_ch_"
    type: Int32
    count: 2
    change: true
    writable: false
  - name: "int32_wr_"
    type: Int32
    count: 2
    default: 0
    change: false
    writable: true

  # UInt32
  - name: "uint32_ch_"
    type: UInt32
    count: 2
    change: true
    writable: false
  - name: "uint32_wr_"
    type: UInt32
    count: 2
    default: 0
    change: false
    writable: true

  # Int64
  - name: "int64_ch_"
    type: Int64
    count: 2
    change: true
    writable: false
  - name: "int64_wr_"
    type: Int64
    count: 2
    default: 0
    change: false
    writable: true

  # UInt64
  - name: "uint64_ch_"
    type: UInt64
    count: 2
    change: true
    writable: false
  - name: "uint64_wr_"
    type: UInt64
    count: 2
    default: 0
    change: false
    writable: true

  # Float
  - name: "float_ch_"
    type: Float
    count: 2
    change: true
    writable: false
  - name: "float_wr_"
    type: Float
    count: 2
    default: 0.0
    change: false
    writable: true

  # Double
  - name: "double_ch_"
    type: Double
    count: 1002
    change: true
    writable: false
  - name: "double_wr_"
    type: Double
    count: 2
    default: 0.0
    change: false
    writable: true

  # String
  - name: "string_ch_"
    type: String
    count: 2
    change: true
    writable: false
  - name: "string_wr_"
    type: String
    count: 2
    default: ""
    change: false
    writable: true

  # DateTime（change 为 true 时按周期递增秒数；可写节点用默认时间）
  - name: "datetime_ch_"
    type: DateTime
    count: 2
    change: true
    writable: false
  - name: "datetime_wr_"
    type: DateTime
    count: 2
    default: "2025-01-01T00:00:00Z"
    change: false
    writable: true
