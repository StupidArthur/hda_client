# 源: matrix.yaml  重新生成: python tools/gen_matrix_configs.py
# 启动: python main.py configs/matrix/p48758_Aes256Sha256RsaPss_Sign_username.yaml

scenario: matrix_Aes256Sha256RsaPss_Sign_username
server: 0.0.0.0
port: 48758
endpoint_path: /ua_auth/
cycle: 1000
namespace_index: 1
application:
  name: UA Auth Lab (matrix port)
  uri: urn:freeopcua:python:server
security:
  trust_store: ../../test_material/certs/trust
  application_certificate:
    cert: ../../test_material/certs/server_cert.pem
    private_key: ../../test_material/certs/server_key.pem
  client_cert_validation: trusted
  policies:
  - Aes256Sha256RsaPss_Sign
  discovery: true
  require_secured_session: true
user_auth:
  anonymous: false
  username: true
  x509: false
  users:
  - username: test
    password: test
nodes:
- name: int32_ch_
  type: Int32
  count: 2
  change: true
  writable: false
- name: int32_wr_
  type: Int32
  count: 2
  default: 0
  change: false
  writable: true
- name: double_ch_
  type: Double
  count: 2
  change: true
  writable: false
- name: double_wr_
  type: Double
  count: 2
  default: 0.0
  change: false
  writable: true
- name: string_ch_
  type: String
  count: 2
  change: true
  writable: false
- name: bool_wr_
  type: Boolean
  count: 2
  default: false
  change: false
  writable: true
