scenario: matrix_Aes256Sha256RsaPss_SignAndEncrypt_anon_basic
server: 0.0.0.0
port: 48790
endpoint_path: /ua_auth/
cycle: 1000
namespace_index: 1
application:
  name: UA Auth Lab (matrix port)
  uri: urn:freeopcua:python:server
security:
  trust_store: ../../test_material/certs/trust
  application_certificate:
    cert: ../../test_material/certs/server_cert.pem
    private_key: ../../test_material/certs/server_key.pem
  client_cert_validation: basic
  policies:
  - Aes256Sha256RsaPss_SignAndEncrypt
  discovery: true
  require_secured_session: true
user_auth:
  anonymous: true
  username: false
  x509: false
nodes:
- name: int32_ch_
  type: Int32
  count: 2
  change: true
  writable: false
- name: int32_wr_
  type: Int32
  count: 2
  default: 0
  change: false
  writable: true
- name: double_ch_
  type: Double
  count: 2
  change: true
  writable: false
- name: double_wr_
  type: Double
  count: 2
  default: 0.0
  change: false
  writable: true
- name: string_ch_
  type: String
  count: 2
  change: true
  writable: false
- name: bool_wr_
  type: Boolean
  count: 2
  default: false
  change: false
  writable: true
